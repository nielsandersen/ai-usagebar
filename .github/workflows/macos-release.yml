name: Personal macOS release
on:
  push:
    tags: ['macos-v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      - name: Verify tag and version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$TAG" = "macos-v$version"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: make test
      - run: ./macos/run-tests.sh
      - run: python3 -m unittest discover -s macos/release -p 'test_*.py'
      - run: ./macos/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.tar.gz
            dist/*.sha256
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: dist
      - name: Publish personal build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/release-draft; then
            if test "$(cat /tmp/release-draft)" = true; then
              gh release upload "$TAG" dist/* --clobber
              gh release edit "$TAG" --draft=false
            else
              echo 'Release already published; preserving its verified immutable assets.'
            fi
          else
            gh release create "$TAG" dist/* --verify-tag --title "AI Usage Bar $TAG" --notes 'Personal macOS edition. See FORK.md for installation, rollback, and authentication behavior.'
          fi
