name: AIUsageBar
options:
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Configuration/Base.xcconfig
  Release: Configuration/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.5.0
    LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/../Frameworks @executable_path/Frameworks'
targetTemplates:
  Widget:
    type: app-extension
    sources:
      - path: Shared
        excludes: [WidgetPublisher.swift]
      - path: Widgets
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Configuration/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: AI Usage Bar
        UsageAppGroup: $(USAGE_APP_GROUP)
        UsageCloudContainer: $(USAGE_CLOUD_CONTAINER)
        UsageDeveloperTeam: $(DEVELOPMENT_TEAM)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Configuration/${target_name}.entitlements
      properties:
        com.apple.security.application-groups: ['$(USAGE_APP_GROUP)']
        com.apple.developer.icloud-container-identifiers: ['$(USAGE_CLOUD_CONTAINER)']
        com.apple.developer.icloud-services: [CloudKit]
targets:
  UsageMac:
    type: application
    platform: macOS
    sources:
      - path: ../macos/ai-usagebar-menubar.swift
      - path: Shared
        excludes: [UsageWidgetView.swift, UsageEntry.swift]
      - path: ../macos/assets/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(USAGE_BUNDLE_PREFIX).mac
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) WIDGET_HOST'
    dependencies:
      - target: UsageMacWidget
        embed: true
    info:
      path: Configuration/UsageMac-Info.plist
      properties:
        CFBundleDisplayName: AI Usage Bar
        CFBundleIconFile: AppIcon
        LSUIElement: true
        UsageAppGroup: $(USAGE_APP_GROUP)
        UsageCloudContainer: $(USAGE_CLOUD_CONTAINER)
        UsageDeveloperTeam: $(DEVELOPMENT_TEAM)
        CFBundleURLTypes:
          - CFBundleURLName: AI Usage Bar
            CFBundleURLSchemes: [aiusagebar]
    entitlements:
      path: Configuration/UsageMac.entitlements
      properties:
        com.apple.security.application-groups: ['$(USAGE_APP_GROUP)']
        com.apple.developer.icloud-container-identifiers: ['$(USAGE_CLOUD_CONTAINER)']
        com.apple.developer.icloud-services: [CloudKit]
  UsageMacWidget:
    templates: [Widget]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(USAGE_BUNDLE_PREFIX).mac.widget
    entitlements:
      path: Configuration/UsageMacWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: ['$(USAGE_APP_GROUP)']
        com.apple.developer.icloud-container-identifiers: ['$(USAGE_CLOUD_CONTAINER)']
        com.apple.developer.icloud-services: [CloudKit]
  UsagePhone:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
        excludes: [WidgetPublisher.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(USAGE_BUNDLE_PREFIX).phone
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - target: UsagePhoneWidget
        embed: true
    info:
      path: Configuration/UsagePhone-Info.plist
      properties:
        CFBundleDisplayName: AI Usage Bar
        UsageAppGroup: $(USAGE_APP_GROUP)
        UsageCloudContainer: $(USAGE_CLOUD_CONTAINER)
        UsageDeveloperTeam: $(DEVELOPMENT_TEAM)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: AI Usage Bar
            CFBundleURLSchemes: [aiusagebar]
    entitlements:
      path: Configuration/UsagePhone.entitlements
      properties:
        com.apple.security.application-groups: ['$(USAGE_APP_GROUP)']
        com.apple.developer.icloud-container-identifiers: ['$(USAGE_CLOUD_CONTAINER)']
        com.apple.developer.icloud-services: [CloudKit]
  UsagePhoneWidget:
    templates: [Widget]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(USAGE_BUNDLE_PREFIX).phone.widget
schemes:
  UsageMac:
    build:
      targets:
        UsageMac: all
  UsagePhone:
    build:
      targets:
        UsagePhone: all
